name: Deploy Square Cloud

# Build Next.js no GitHub Actions; Square só instala deps e sobe com `npm start`.
# Docs:
# - https://docs.squarecloud.app/pt-br/tutorials/website/nextjs
# - https://help.squarecloud.app/pt-br/article/workflow-github-actions-deploy-automatico-o6c7e2/

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check secrets
        run: npm run check:secrets

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build && chmod -R a+rX .next next.config.ts package.json
        env:
          NEXT_PUBLIC_API_URL: https://www.api.elloot.com.br
          NEXT_PUBLIC_SITE_URL: https://www.elloot.com.br

      - name: Pack release zip
        run: |
          zip -r project.zip \
            package.json \
            package-lock.json \
            squarecloud.app \
            next.config.ts \
            postcss.config.mjs \
            .next \
            public \
            -x ".next/cache/*" "*.map" ".next/types/*" ".next/diagnostics/*"

      - name: Show zip size
        run: ls -lh project.zip

      - name: Require Square Cloud secrets
        env:
          SQUARE_CLOUD_TOKEN: ${{ secrets.SQUARE_CLOUD_TOKEN }}
          SQUARECLOUD_APP_ID: ${{ secrets.SQUARECLOUD_APP_ID }}
        run: |
          missing=0
          if [ -z "$SQUARE_CLOUD_TOKEN" ]; then
            echo "::error::Secret SQUARE_CLOUD_TOKEN não configurado. Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$SQUARECLOUD_APP_ID" ]; then
            echo "::error::Secret SQUARECLOUD_APP_ID não configurado. Use o ID da app no painel Square Cloud."
            missing=1
          fi
          exit $missing

      - name: Deploy on Square Cloud
        uses: squarecloudofc/github-action@v2
        with:
          command: commit --file project.zip ${{ secrets.SQUARECLOUD_APP_ID }} --restart
          token: ${{ secrets.SQUARE_CLOUD_TOKEN }}
        # Square API sometimes times out on large Next zips; one automatic retry helps.
        continue-on-error: true
        id: deploy1

      - name: Retry deploy on Square Cloud
        if: steps.deploy1.outcome == 'failure'
        uses: squarecloudofc/github-action@v2
        with:
          command: commit --file project.zip ${{ secrets.SQUARECLOUD_APP_ID }} --restart
          token: ${{ secrets.SQUARE_CLOUD_TOKEN }}
